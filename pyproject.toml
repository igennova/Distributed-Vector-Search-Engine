[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsearch"
version = "0.1.0"
description = "A distributed approximate-nearest-neighbor vector search engine built from scratch."
requires-python = ">=3.10"
dependencies = ["numpy", "grpcio>=1.84.0", "protobuf>=7.35.1"]

[project.optional-dependencies]
embed = ["fastembed>=0.9"]     # the local embedding model behind `vsearch ingest` / `search`

[project.scripts]
vsearch = "vsearch.cli:main"

[tool.setuptools.packages.find]
include = ["vsearch*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
